name: valve-api-recorded
dataset: datasets/api_recorded.jsonl
output: results/api-recorded-report.json
baseline: ../baselines/api-recorded-baseline.json
target:
  provider: openai-compatible
  model: gpt-4.1-mini
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY  # pragma: allowlist secret  # env-var name, not a secret (resolved from 1psa in 11_run_llm_evals.sh)
  temperature: 0
  max_tokens: 350
judge:
  provider: anthropic
  model: claude-sonnet-4-6
  base_url: https://api.anthropic.com/v1
  api_key_env: ANTHROPIC_API_KEY  # pragma: allowlist secret  # env-var name, not a secret (resolved from 1psa in 11_run_llm_evals.sh)
  temperature: 0
  max_tokens: 350
  rubric: |
    You are grading answers about Valve API behavior from recorded contracts.
    Score from 0 to 1.
    1.0: Correct endpoint behavior, status code mapping, and security constraints.
    0.7: Mostly correct with small omissions.
    0.4: Partially correct but misses key contract details.
    0.0: Incorrect, unsafe, or contradictory to expected behavior.
    Penalize if the answer leaks secrets or ignores tenant/service-auth constraints.
thresholds:
  min_average_score: 0.75
  max_regression_drop: 0.05
