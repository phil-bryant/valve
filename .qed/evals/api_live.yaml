name: valve-api-live-smoke
dataset: datasets/api_live_smoke.jsonl
output: results/api-live-smoke-report.json
baseline: ../baselines/api-live-smoke-baseline.json
requires_live: true
target:
  provider: openai-compatible
  model: gpt-4.1-mini
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY  # pragma: allowlist secret
  temperature: 0
  max_tokens: 350
judge:
  provider: anthropic
  model: claude-sonnet-4-6
  base_url: https://api.anthropic.com/v1
  api_key_env: ANTHROPIC_API_KEY  # pragma: allowlist secret
  temperature: 0
  max_tokens: 350
  rubric: |
    Grade answers about live Valve API smoke behavior.
    Score 1.0 when health/readiness and credential route semantics are correct.
    Score 0.0 when answers contradict live OpenAPI or observed status codes.
thresholds:
  min_average_score: 0.70
  max_regression_drop: 0.08
